version: 1

application:
  id: customer-file-platform
  name: Customer File Platform
  public_host: files.tools.denox-corp.com

auth:
  mode: oidc
  login_required: true

platform_access:
  roles: []
  routes: []

business_capabilities:
  resources:
    - type: file
      actions: [read, create, update, delete, share]
    - type: workspace
      actions: [read, administer]

oauth_client:
  client_id: customer-file-platform
  name: Customer File Platform
  redirect_uris:
    - https://files.tools.denox-corp.com/auth/oidc/callback
  grant_types:
    - authorization_code
  scopes:
    - openid
    - profile
    - email
