name: customer-file-platform

services:
  postgres:
    image: postgres:16.10-alpine
    container_name: customer-file-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cells
      POSTGRES_USER: cells
      POSTGRES_PASSWORD: ${CELLS_DB_PASSWORD:?CELLS_DB_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cells -d cells"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default

  cells:
    image: customer-file-platform-cells:oidc-poc-v0.2.3
    container_name: customer-file-platform-cells
    restart: unless-stopped
    entrypoint: ["/opt/denox/bin/cells-entrypoint.sh"]
    command: ["cells", "start"]
    environment:
      CELLS_WORKING_DIR: /var/cells
      CELLS_DATA_DIR: /var/cells/data
      CELLS_INSTALL_YAML: /etc/cells/install.yml
      CELLS_BIND: 0.0.0.0:8080
      CELLS_EXTERNAL: https://files.tools.denox-corp.com
      CELLS_NO_TLS: "1"
      CELLS_ADMIN_PWD: ${CELLS_ADMIN_PWD:?CELLS_ADMIN_PWD is required}
      CELLS_DB_PASSWORD: ${CELLS_DB_PASSWORD:?CELLS_DB_PASSWORD is required}
      CELLS_CUSTOMER_OIDC_CLIENT_SECRET: ${CELLS_CUSTOMER_OIDC_CLIENT_SECRET:?CELLS_CUSTOMER_OIDC_CLIENT_SECRET is required}
      CELLS_NAS_SENTINEL: ${CELLS_NAS_SENTINEL:?CELLS_NAS_SENTINEL is required}
    expose:
      - "8080"
    volumes:
      - ./data/cells:/var/cells
      - customer_file_platform_nas:/var/cells/data
      - ./install.yml:/etc/cells/install.yml:ro
      - ./cells-entrypoint.sh:/opt/denox/bin/cells-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/a/frontend/bootconf"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - default

volumes:
  customer_file_platform_nas:
    name: customer-file-platform-nas
    driver: local
    driver_opts:
      type: nfs
      o: addr=${CELLS_NAS_MOUNT_HOST:?CELLS_NAS_MOUNT_HOST is required},nfsvers=4.0,hard,noresvport,timeo=600,retrans=2
      device: :${CELLS_NAS_EXPORT:-/}
